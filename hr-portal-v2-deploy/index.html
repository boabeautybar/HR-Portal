<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body {
    font-family: "DM Sans", system-ui, sans-serif;
    background: #FCF5F7;
    color: #111827;
  }
  #initial-loading {
    display: flex; align-items: center; justify-content: center;
    height: 100vh;
    font-family: "Outfit", system-ui, sans-serif;
    color: #831843;
    font-size: 18px;
    letter-spacing: 0.18em;
    font-weight: 700;
    text-transform: uppercase;
    flex-direction: column;
    gap: 16px;
  }
  #initial-loading .spinner {
    width: 28px; height: 28px;
    border: 3px solid #FBCFE8; border-top-color: #BE185D;
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
