<style>
  :root { --pink:#BE185D; --deep:#831843; --bg:#FCF5F7; --ink:#1f2937; --line:#f3d4e0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: "DM Sans", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    padding: 18px 14px calc(40px + env(safe-area-inset-bottom));
    line-height: 1.45;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .back { display:inline-block; color:#9d6a82; font-size:13px; font-weight:600; text-decoration:none; margin-bottom:2px; }
  .brand { text-align: center; margin: 6px 0 14px; }
  .brand img { width: min(200px, 60%); height: auto; display: inline-block; }
  h1 { font-family: "Outfit", system-ui, sans-serif; font-weight: 600; font-size: 22px; color: var(--deep); margin: 8px 0 4px; text-align: center; letter-spacing: .005em; }
  .sub { text-align: center; color: #9d6a82; font-size: 14px; margin: 0 auto 18px; max-width: 440px; }
  .reassure {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 15px; font-size: 13.5px; color: #6b3a4e; margin-bottom: 18px;
  }
  .reassure strong { color: var(--deep); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; margin-bottom: 16px; }
  label.field { display: block; margin-bottom: 16px; }
  label.field > span { display: block; font-weight: 700; font-size: 13px; color: var(--deep); margin-bottom: 6px; }
  input[type=text], input[type=tel], select, textarea {
    width: 100%; font-family: inherit; font-size: 16px; color: var(--ink);
    background: #fff; border: 1.5px solid #e7c6d4; border-radius: 11px;
    padding: 12px 13px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(190,24,93,.12); }
  textarea { resize: vertical; min-height: 120px; }
  .hint { font-size: 12px; color: #a07487; margin-top: 5px; font-weight: 400; }

  /* Date field — bigger, clearly tappable, with quick-pick chips */
  .date-input {
    appearance: none; -webkit-appearance: none;
    font-weight: 600; color: var(--deep);
    min-height: 52px; font-size: 17px;
    background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='%23BE185D' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg>") no-repeat right 13px center;
    padding-right: 44px;
  }
  .date-input::-webkit-calendar-picker-indicator { opacity: 0; position: absolute; right: 0; width: 44px; height: 52px; cursor: pointer; }
  .quickdates { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .quickdate {
    font-family: inherit; font-size: 13px; font-weight: 600;
    background: #fff; color: var(--deep); border: 1.5px solid #e7c6d4;
    border-radius: 999px; padding: 8px 15px; cursor: pointer;
  }
  .quickdate.on { background: var(--pink); color: #fff; border-color: var(--pink); }

  .urgent-btn {
    width: 100%; border: none; border-radius: 16px; cursor: pointer;
    background: #dc2626; color: #fff; font-family: "Outfit", sans-serif;
    font-weight: 800; font-size: 19px; letter-spacing: .01em;
    padding: 18px 16px; margin-bottom: 6px; line-height: 1.25;
    box-shadow: 0 6px 18px rgba(220,38,38,.32);
    transition: transform .08s ease;
  }
  .urgent-btn:active { transform: scale(.985); }
  .urgent-btn small { display: block; font-weight: 600; font-size: 12.5px; opacity: .92; margin-top: 4px; }
  .urgent-btn.on { background: #7f1d1d; animation: pulse 1.4s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(220,38,38,.5); }
    70% { box-shadow: 0 0 0 12px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }
  .urgent-note { text-align:center; font-size:12.5px; color:#b91c1c; font-weight:600; margin: 0 0 18px; min-height: 16px; }

  .toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: var(--deep); font-weight: 600; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--pink); }
  .optional-box { margin-top: 14px; padding-top: 4px; }

  .photo-row { display:flex; align-items:center; gap:12px; flex-wrap: wrap; }
  .photo-btn {
    display:inline-block; background:#fdf2f8; border:1.5px dashed #e7a3c2; color:var(--deep);
    border-radius:11px; padding:11px 16px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .photo-btn input { display:none; }
  #photoPrev { max-width: 110px; max-height: 110px; border-radius: 10px; border:1px solid var(--line); }
  .photo-clear { background:none; border:none; color:#b91c1c; font-weight:700; cursor:pointer; font-size:13px; }

  .submit {
    width: 100%; border: none; border-radius: 14px; cursor: pointer;
    background: var(--pink); color: #fff; font-family: "Outfit", sans-serif;
    font-weight: 800; font-size: 17px; padding: 16px; margin-top: 4px;
    box-shadow: 0 6px 16px rgba(190,24,93,.28);
  }
  .submit:disabled { opacity: .55; cursor: default; box-shadow: none; }
  .err { color:#b91c1c; font-weight:600; font-size:13.5px; margin-top:10px; text-align:center; min-height: 16px; }

  /* Confirmation */
  .done { text-align:center; padding: 26px 6px; }
  .done .tick { font-size: 56px; }
  .done h2 { font-family:"Outfit",system-ui,sans-serif; font-weight:600; color:var(--deep); font-size:22px; margin:8px 0 6px; }
  .done .ref { display:inline-block; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:10px 18px; font-family:"Outfit",sans-serif; font-weight:800; font-size:20px; color:var(--pink); letter-spacing:.04em; margin:10px 0; }
  .done p { color:#6b3a4e; font-size:14px; max-width: 420px; margin: 8px auto; }
  .foot { text-align:center; font-size:11.5px; color:#bf94a5; margin-top: 22px; }
</style>
