<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>My BOA</title>
<meta name="theme-color" content="#BE185D" />
<link rel="icon" type="image/png" href="BOA.png" />
<link rel="apple-touch-icon" href="BOA.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="My BOA" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --pink:#BE185D; --deep:#831843; --bg:#FCF5F7; --line:#f3d4e0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: #1f2937;
    padding: 26px 16px calc(40px + env(safe-area-inset-bottom)); line-height: 1.45; }
  .wrap { max-width: 520px; margin: 0 auto; }
  .brand { text-align: center; margin-bottom: 10px; }
  .brand img { width: 76px; height: 76px; border-radius: 18px; object-fit: cover; }
  h1 { font-family: "Playfair Display", serif; font-size: 30px; color: var(--deep); margin: 12px 0 2px; text-align: center; letter-spacing: .01em; }
  .sub { text-align: center; color: #9d6a82; font-size: 14.5px; margin: 0 auto 22px; max-width: 380px; }
  .tile {
    display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 20px 18px; margin-bottom: 14px; text-decoration: none; color: inherit;
    box-shadow: 0 4px 14px rgba(190,24,93,0.06); cursor: pointer;
    transition: transform .08s ease, box-shadow .15s ease;
  }
  .tile:active { transform: scale(.99); }
  .tile .ic { font-size: 30px; width: 54px; height: 54px; flex: 0 0 54px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; }
  .tile .tx { flex: 1; }
  .tile .t { font-family: "Outfit", sans-serif; font-weight: 800; font-size: 18px; color: var(--deep); }
  .tile .d { font-size: 13px; color: #8a6275; margin-top: 2px; }
  .tile .arr { color: #d9a7bd; font-size: 22px; font-weight: 700; }
  .tile.sched .ic { background: #e0f2fe; }
  .tile.incident .ic { background: #fee2e2; }
  .tile.leave .ic { background: #dcfce7; }
  .tile.soon { opacity: .65; cursor: default; }
  .tile.soon .arr { font-size: 11px; font-weight: 700; color: #b58aa0; background:#f7e7ee; padding:3px 8px; border-radius:999px; }
  .foot { text-align: center; font-size: 11.5px; color: #bf94a5; margin-top: 24px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="BOA.png" alt="BOA" /></div>
    <h1>My BOA</h1>
    <p class="sub">Welcome — choose what you'd like to do.</p>

    <a class="tile sched" href="schedule.html">
      <div class="ic">📅</div>
      <div class="tx"><div class="t">My schedule</div><div class="d">See your shifts — today, this week or the month</div></div>
      <div class="arr">›</div>
    </a>

    <a class="tile incident" href="report.html">
      <div class="ic">🛡️</div>
      <div class="tx"><div class="t">Report an incident</div><div class="d">Private & anonymous — only HR can see it</div></div>
      <div class="arr">›</div>
    </a>

    <div class="tile leave soon">
      <div class="ic">🌴</div>
      <div class="tx"><div class="t">Request leave</div><div class="d">Book time off — coming soon</div></div>
      <div class="arr">Soon</div>
    </div>

    <p class="foot">My BOA · for BOA team members</p>
  </div>
</body>
</html>
