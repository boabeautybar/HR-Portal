<style>
  :root { --pink:#BE185D; --deep:#831843; --bg:#FCF5F7; --ink:#1f2937; --line:#f3d4e0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: "DM Sans", system-ui, sans-serif; color: var(--ink);
    background: radial-gradient(130% 90% at 50% -10%, #FCE0EE 0%, #FDEFF5 42%, #FFF7FB 100%) fixed;
    padding: 16px 14px calc(40px + env(safe-area-inset-bottom)); line-height: 1.45; }
  .wrap, #root { max-width: 560px; margin: 0 auto; }
  .back { display:inline-block; color:#9d6a82; font-size:13px; font-weight:600; text-decoration:none; margin-bottom:6px; }
  .brand { text-align:center; margin:4px 0 10px; }
  .brand img { width:min(200px, 60%); height:auto; display:inline-block; }
  h1 { font-family:"Outfit",system-ui,sans-serif; font-weight:600; font-size:22px; color:var(--deep); margin:6px 0 4px; text-align:center; letter-spacing:.005em; }
  .sub { text-align:center; color:#9d6a82; font-size:14px; margin:0 0 16px; }
  .card { background:linear-gradient(180deg,#fff,#fffafc); border:1px solid #FBCFE8; border-radius:16px; padding:18px 16px; margin-bottom:16px;
    box-shadow:0 0 0 1px rgba(244,114,182,0.22), 0 0 14px rgba(244,114,182,0.14), 0 6px 18px rgba(190,24,93,0.07); }
  label.field { display:block; margin-bottom:16px; }
  label.field > span { display:block; font-weight:700; font-size:13px; color:var(--deep); margin-bottom:6px; }
  input, select, textarea { width:100%; font-family:inherit; font-size:16px; color:var(--ink); background:#fff;
    border:1.5px solid #e7c6d4; border-radius:11px; padding:12px 13px; outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(190,24,93,.12); }
  textarea { resize:vertical; min-height:90px; }
  .hint { font-size:12px; color:#a07487; margin-top:5px; font-weight:400; }
  .row2 { display:flex; gap:12px; }
  .row2 > label { flex:1; }
  .span { background:#fdf2f8; border:1px solid #f9a8d4; border-radius:10px; padding:9px 12px; font-size:13px; color:var(--deep); font-weight:600; margin-bottom:16px; }
  .submit { width:100%; border:none; border-radius:14px; cursor:pointer; background:var(--pink); color:#fff;
    font-family:"Outfit",sans-serif; font-weight:800; font-size:17px; padding:16px; box-shadow:0 6px 16px rgba(190,24,93,.28); }
  .submit:disabled { opacity:.55; box-shadow:none; }
  .err { color:#b91c1c; font-weight:600; font-size:13.5px; margin-top:10px; text-align:center; min-height:16px; }
  .done { text-align:center; padding:26px 6px; }
  .done .tick { font-size:56px; }
  .done h2 { font-family:"Outfit",system-ui,sans-serif; font-weight:600; color:var(--deep); font-size:22px; margin:8px 0 6px; }
  .done .ref { display:inline-block; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:10px 18px;
    font-family:"Outfit",sans-serif; font-weight:800; font-size:20px; color:var(--pink); letter-spacing:.04em; margin:10px 0; }
  .done p { color:#6b3a4e; font-size:14px; max-width:420px; margin:8px auto; }
  .foot { text-align:center; font-size:11.5px; color:#bf94a5; margin-top:18px; }
