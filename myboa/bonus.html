<style>
  :root { --pink:#BE185D; --deep:#831843; --bg:#FCF5F7; --ink:#1f2937; --line:#f3d4e0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: "DM Sans", system-ui, sans-serif; color: var(--ink);
    background: radial-gradient(130% 90% at 50% -10%, #FCE0EE 0%, #FDEFF5 42%, #FFF7FB 100%) fixed;
    padding: 16px 14px calc(40px + env(safe-area-inset-bottom)); line-height: 1.45; }
  .wrap, #root { max-width: 560px; margin: 0 auto; }
  .back { display:inline-block; color:#9d6a82; font-size:13px; font-weight:600; text-decoration:none; margin-bottom:6px; }
  .brand { text-align:center; margin:4px 0 10px; }
  .brand img { width:min(200px, 60%); height:auto; display:inline-block; }
  h1 { font-family:"Outfit",system-ui,sans-serif; font-weight:600; font-size:22px; color:var(--deep); margin:6px 0 4px; text-align:center; letter-spacing:.005em; }
  .sub { text-align:center; color:#9d6a82; font-size:14px; margin:0 0 16px; }
  .card { background:linear-gradient(180deg,#fff,#fffafc); border:1px solid #FBCFE8; border-radius:16px; padding:18px 16px; margin-bottom:16px;
    box-shadow:0 0 0 1px rgba(244,114,182,0.22), 0 0 14px rgba(244,114,182,0.14), 0 6px 18px rgba(190,24,93,0.07); }
  /* Calculator "display" — the live payout, like a calculator screen. */
  .calc-display { background:linear-gradient(135deg, var(--deep) 0%, var(--pink) 55%, #F472B6 100%); color:#fff;
    border-radius:20px; padding:22px 20px; margin-bottom:16px; text-align:center;
    box-shadow:0 12px 30px rgba(190,24,93,0.30); }
  .calc-display .cd-label { font-family:"Outfit",sans-serif; font-size:11.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,0.85); }
  .calc-display .cd-amt { font-family:"Outfit",sans-serif; font-weight:900; font-size:46px; line-height:1.05; margin:7px 0 4px; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .calc-display .cd-sub { font-size:12px; color:rgba(255,255,255,0.82); }
  label.field { display:block; margin-bottom:16px; }
  label.field > span, .flbl { display:block; font-weight:700; font-size:13px; color:var(--deep); margin-bottom:7px; }
  .fblock { margin-bottom:16px; }
  input, select { width:100%; font-family:inherit; font-size:16px; color:var(--ink); background:#fff;
    border:1.5px solid #e7c6d4; border-radius:11px; padding:12px 13px; outline:none; }
  input:focus, select:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(190,24,93,.12); }
  .hint { font-size:12px; color:#a07487; margin-top:5px; font-weight:400; }
  /* Segmented control */
  .seg { display:flex; gap:8px; }
  .seg button { flex:1; padding:12px 8px; border:1.5px solid #e7c6d4; background:#fff; border-radius:11px;
    font-family:"Outfit",sans-serif; font-weight:700; font-size:15px; color:#83476a; cursor:pointer; transition:all .12s; }
  .seg button.on { background:var(--pink); color:#fff; border-color:var(--pink); box-shadow:0 4px 12px rgba(190,24,93,.22); }
  .seg.yn button.on.no { background:#16a34a; border-color:#16a34a; box-shadow:0 4px 12px rgba(22,163,74,.24); }
  /* Turnover input with R prefix */
  .turn { position:relative; }
  .turn .cur { position:absolute; left:13px; top:50%; transform:translateY(-50%); font-weight:700; color:#9d6a82; font-size:16px; pointer-events:none; }
  .turn input { padding-left:30px; font-weight:700; }
  /* Results */
  .res { display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; border-bottom:1px dashed #f0d4e0; }
  .res:last-child { border-bottom:none; }
  .res .lbl { color:#6b3a4e; font-size:14px; }
  .res .lbl small { display:block; color:#a07487; font-size:11.5px; font-weight:400; }
  .res .amt { font-weight:700; font-size:15px; color:var(--deep); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .res .amt.neg { color:#b91c1c; }
  .res.muted .amt, .res.muted .lbl { color:#b59; opacity:.6; }
  .res.total { margin-top:8px; padding-top:14px; border-top:2px solid #F472B6; border-bottom:none; }
  .ded.below { margin:14px 0 0; }
  .res.total .lbl { font-family:"Outfit",sans-serif; font-weight:800; font-size:16px; color:var(--deep); }
  .res.total .amt { font-family:"Outfit",sans-serif; font-weight:900; font-size:24px; color:var(--pink); }
  .ded { background:#fff7ed; border:1px solid #fed7aa; border-radius:11px; padding:10px 13px; font-size:13px;
    color:#9a3412; font-weight:600; margin:12px 0 2px; display:flex; gap:8px; align-items:center; }
  .ded.ok { background:#f0fdf4; border-color:#bbf7d0; color:#15803d; }
  .sech { font-family:"Outfit",sans-serif; font-weight:800; font-size:13px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--pink); margin:2px 0 12px; }
  .note { background:#fff7fb; border:1px solid #f6c9dd; border-radius:12px; padding:12px 14px; font-size:12.5px; line-height:1.5; color:#83476a; margin-top:14px; }
  .note b { color:#9d174d; }
  /* Calculator layout — single column on phones; on desktop the calculated
     portion (display + receipt) sits beside the inputs. */
  .calc-col > .card:last-child, .calc-col > .calc-display:last-child { margin-bottom: 16px; }
  @media (min-width: 760px) {
    .wrap, #root { max-width: 960px; }
    .calc-grid { display: grid; grid-template-columns: 1.04fr 0.96fr; gap: 18px; align-items: start; }
    .calc-col > *:last-child { margin-bottom: 0; }
  }
  /* Important disclaimer — prominent, must-read. */
  .disclaimer { background:#FFF7ED; border:1px solid #FED7AA; border-left:5px solid #F59E0B; border-radius:14px;
    padding:14px 16px; margin:6px 0 14px; box-shadow:0 4px 14px rgba(245,158,11,0.10); }
  .disclaimer .dc-h { font-family:"Outfit",sans-serif; font-weight:800; font-size:13.5px; color:#9A3412; margin-bottom:5px; letter-spacing:.01em; }
  .disclaimer .dc-b { font-size:12.5px; line-height:1.55; color:#7c4a1e; }
  .disclaimer .dc-b b { color:#9A3412; }
  .foot { text-align:center; font-size:11.5px; color:#bf94a5; margin-top:18px; }
