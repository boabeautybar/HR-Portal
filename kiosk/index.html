<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BOA Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&family=Sora:wght@300;400;600;700;800&family=Pinyon+Script&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />

<!-- PWA Meta Tags -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#BE185D" />
<link rel="apple-touch-icon" href="icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<script>
  window.globalDeferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.globalDeferredPrompt = e;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        console.log('Pass-through Service Worker registered.', reg);
      }).catch(err => {
        console.log('Service Worker registration failed:', err);
      });
    });
  }
</script>
</head>
<body>

<!-- PIN overlay -->
<div id="pin-overlay">
  <div id="kiosk-admin-unlock" style="position: absolute; top: 16px; right: 20px; font-size: 24px; cursor: pointer; user-select: none; z-index: 9999;" title="Admin Login">🛡️</div>
  <div class="pin-card">
    <div class="pin-logo" id="pin-brand">BOA Check-in</div>
    <div class="pin-sub">ENTER YOUR PIN</div>
    <div class="pin-inputs">
      <input type="password" inputmode="numeric" maxlength="1" class="pin-digit" autocomplete="off">
      <input type="password" inputmode="numeric" maxlength="1" class="pin-digit" autocomplete="off">
      <input type="password" inputmode="numeric" maxlength="1" class="pin-digit" autocomplete="off">
      <input type="password" inputmode="numeric" maxlength="1" class="pin-digit" autocomplete="off">
    </div>
    <div class="pin-error" id="pin-error">&nbsp;</div>
    <div id="kiosk-enrol-device" style="display:none; margin-top:18px; font-size:12px; color:#b5849b; cursor:pointer; user-select:none; text-decoration:underline; text-underline-offset:3px;">Enroll this device</div>
  </div>
</div>

<!-- App root (filled by staff-app.js or manager-app.js based on PIN) -->
<div id="app-root"></div>

<!-- Supabase JS SDK from CDN (no build step needed) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- App scripts. Order matters: config → data → security → gate → role apps -->
<script src="config.js"></script>
<script src="data.js"></script>
<script src="security.js"></script>
<script src="pin-gate.js"></script>
<script src="staff-app.js"></script>
<script src="manager-app.js"></script>

</body>
</html>
