<style>
  :root { --pink:#BE185D; --deep:#831843; --bg:#FCF5F7; --ink:#1f2937; --line:#f3d4e0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink);
    padding: 16px 14px calc(40px + env(safe-area-inset-bottom)); line-height: 1.45; }
  .wrap, #root { max-width: 560px; margin: 0 auto; }
  .back { display: inline-block; color: #9d6a82; font-size: 13px; font-weight: 600; text-decoration: none; margin-bottom: 6px; }
  .brand { text-align: center; margin: 2px 0 10px; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; }
  h1 { font-family: "Playfair Display", serif; font-size: 26px; color: var(--deep); margin: 6px 0 4px; text-align: center; }
  .sub { text-align: center; color: #9d6a82; font-size: 14px; margin: 0 0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 16px; margin-bottom:16px; }
  .card.pad { padding: 8px 12px; }
  label.field { display:block; margin-bottom:16px; }
  label.field > span { display:block; font-weight:700; font-size:13px; color:var(--deep); margin-bottom:6px; }
  input[type=text], select { width:100%; font-family:inherit; font-size:16px; color:var(--ink); background:#fff;
    border:1.5px solid #e7c6d4; border-radius:11px; padding:12px 13px; outline:none; }
  input:focus, select:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(190,24,93,.12); }
  .submit { width:100%; border:none; border-radius:14px; cursor:pointer; background:var(--pink); color:#fff;
    font-family:"Outfit",sans-serif; font-weight:800; font-size:17px; padding:15px; box-shadow:0 6px 16px rgba(190,24,93,.28); }
  .submit:disabled { opacity:.55; box-shadow:none; }
  .err { color:#b91c1c; font-weight:600; font-size:13.5px; margin-top:10px; min-height:16px; }
  .foot { text-align:center; font-size:11.5px; color:#bf94a5; margin-top:18px; }

  .dashhead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .hi { font-family:"Playfair Display",serif; font-size:23px; color:var(--deep); }
  .meta { font-size:13px; color:#9d6a82; margin-top:2px; }
  .chg { background:#fff; border:1.5px solid #e7c6d4; color:var(--deep); border-radius:9px; padding:8px 13px; font-weight:700; font-size:13px; font-family:inherit; cursor:pointer; }

  .tabs { display:flex; gap:7px; margin-bottom:14px; }
  .tab { flex:1; border:1.5px solid #e7c6d4; background:#fff; color:var(--deep); border-radius:11px; padding:10px 6px;
    font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; }
  .tab.on { background:var(--pink); color:#fff; border-color:var(--pink); }

  .dayrow { display:flex; align-items:center; gap:12px; padding:13px 8px; border-bottom:1px solid #f6e6ee; }
  .dayrow:last-child { border-bottom:none; }
  .dayrow.is-today { background:#fff5f9; border-radius:10px; }
  .dayrow.big { padding:16px 10px; }
  .dleft { min-width:84px; }
  .dname { font-weight:800; color:var(--deep); font-size:14px; }
  .dayrow.big .dname { font-size:17px; }
  .ddate { font-size:12px; color:#a07487; }
  .st { margin-left:auto; text-align:right; font-weight:800; font-size:14px; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .st-sub { font-weight:600; font-size:12px; color:#6b7280; }
  .st-work { color:#15803d; }
  .st-off { color:#9ca3af; }
  .st-leave { color:#b45309; }
  .st-none { color:#cbb1bd; font-weight:600; font-size:13px; }

  .monthnav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .navb { background:#fff; border:1.5px solid #e7c6d4; color:var(--deep); border-radius:10px; width:42px; height:42px; font-size:20px; cursor:pointer; }
  .mlbl, .weeklbl { font-weight:800; color:var(--deep); font-size:14px; text-align:center; }
  .weeklbl { margin-bottom:10px; }
</style>
</head>
<body>
  <div id="root">
    <div class="brand"><img src="BOA.png" alt="BOA" /></div>
    <h1>My schedule</h1>
    <p class="sub">Loading…</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="schedule.js"></script>
</body>
